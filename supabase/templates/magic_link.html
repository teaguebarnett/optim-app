<!--
  Phase 6.0A-V live-run fix. app/auth/sign-in/page.tsx asks the user to
  type in "the 6-digit code sent to {email}" and verifies it with
  supabase.auth.verifyOtp({ token: code, type: "email" }) — but the stock
  `supabase init` default magic-link template only ever renders a
  clickable {{ .ConfirmationURL }} link, never the underlying {{ .Token }}
  GoTrue also generates for the same request. A real user following the
  UI as designed would have had no code to type in. This template surfaces
  the code the app actually asks for; the link is kept as a secondary,
  equally valid way in for anyone who'd rather click through.
-->
<h2>Your OPTIM sign-in code</h2>
<p style="font-size: 32px; font-weight: 600; letter-spacing: 4px;">{{ .Token }}</p>
<p>Enter this code at the sign-in screen. It expires shortly and can only be used once.</p>
<p>Prefer to click through instead? <a href="{{ .ConfirmationURL }}">Sign in</a>.</p>
