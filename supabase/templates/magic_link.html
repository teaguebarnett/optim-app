<!--
  app/auth/sign-in/page.tsx no longer asks for a typed code — see that
  file's own doc: hosted optim-beta has no custom SMTP, so its stock
  magic-link email never shows one, and asking for a code that mail never
  delivers would be wrong. This local-dev template is updated to match: a
  link only, built the same explicit token_hash+type way
  invite.html already uses, exchanged by app/auth/confirm/page.tsx via
  supabase.auth.verifyOtp — not {{ .ConfirmationURL }}, which routes
  through GoTrue's own hosted verify endpoint and back with the session as
  a PKCE `?code=` (since @supabase/ssr's browser client hardcodes
  flowType: "pkce" — see app/auth/confirm/page.tsx), unnecessarily tying
  the link to the same browser that requested it.
-->
<h2>Your OPTIM sign-in link</h2>
<p><a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email">Sign in to OPTIM</a></p>
<p>This link expires shortly and can only be used once.</p>
